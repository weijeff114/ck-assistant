<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cf · Galgame 模式 v2.4</title>
    <style>
        :root { --bg-deep: #0a0a12; --bg-panel: rgba(22, 22, 34, 0.85); --accent: #ff7eb6; --accent-2: #7be3ff; --accent-3: #b388ff; --text: #e8e8f0; --text-dim: #8a8aa0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
        body { background: radial-gradient(circle at 50% 0%, #1a1a2e 0%, var(--bg-deep) 60%); color: var(--text); min-height: 100vh; display: flex; justify-content: center; padding: 20px; overflow-x: hidden; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(2px 2px at 20% 30%, rgba(255,126,182,0.4), transparent), radial-gradient(2px 2px at 60% 70%, rgba(123,227,255,0.4), transparent); background-size: 400px 400px; pointer-events: none; z-index: 0; }
        .container { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 18px; position: relative; z-index: 1; }
        .topbar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); backdrop-filter: blur(20px); border: 1px solid rgba(255,126,182,0.2); padding: 12px 20px; border-radius: 16px; }
        .topbar h1 { font-size: 16px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .topbar-controls { display: flex; align-items: center; gap: 8px; }
        .topbar select { background: rgba(0,0,0,0.4); color: var(--accent-2); border: 1px solid rgba(123,227,255,0.3); border-radius: 8px; padding: 6px 12px; font-weight: bold; outline: none; font-size: 12px; }
        .icon-btn { background: rgba(255,126,182,0.15); border: 1px solid rgba(255,126,182,0.4); color: var(--accent); border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .scene { background: var(--bg-panel); backdrop-filter: blur(20px); border: 1px solid rgba(123,227,255,0.15); border-radius: 20px; padding: 30px 25px; min-height: 180px; display: flex; flex-direction: column; justify-content: center; }
        .character-tag { display: inline-block; background: linear-gradient(135deg, var(--accent), var(--accent-3)); color: #0a0a12; font-weight: bold; font-size: 12px; padding: 4px 14px; border-radius: 20px; margin-bottom: 15px; align-self: flex-start; }
        .dialogue { font-size: 17px; line-height: 1.7; color: #fff; padding: 15px 20px; background: rgba(0,0,0,0.3); border-left: 3px solid var(--accent); border-radius: 8px; }
        .dialogue::before { content: '「'; color: var(--accent); font-size: 20px; margin-right: 2px; }
        .dialogue::after { content: '」'; color: var(--accent); font-size: 20px; margin-left: 2px; }
        .status-bar { display: flex; gap: 10px; margin-top: 18px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.08); }
        .status-item { flex: 1; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 12px; text-align: center; font-size: 12px; color: var(--text-dim); }
        .status-item .value { display: block; font-size: 20px; font-weight: bold; margin-top: 4px; }
        .affinity-val { color: #ff7eb6; } .danger-val { color: #ffb84d; }
        .advice-box { background: linear-gradient(135deg, rgba(179,136,255,0.15), rgba(123,227,255,0.1)); border: 1px solid rgba(179,136,255,0.3); border-radius: 14px; padding: 15px 20px; font-size: 13px; color: #d0c0ff; display: none; }
        .advice-box::before { content: '💡 '; }
        .choices { display: flex; flex-direction: column; gap: 12px; }
        .choice-btn { background: linear-gradient(135deg, rgba(255,126,182,0.08), rgba(179,136,255,0.05)); border: 2px solid rgba(255,126,182,0.3); border-radius: 16px; padding: 18px 22px; text-align: left; color: var(--text); cursor: pointer; display: none; }
        .choice-btn:hover { background: rgba(255,126,182,0.2); border-color: var(--accent); transform: translateX(6px); }
        .choice-style { font-size: 11px; font-weight: bold; padding: 3px 10px; border-radius: 20px; display: inline-block; margin-bottom: 8px; background: rgba(255,126,182,0.2); color: var(--accent); }
        .choice-style.humor { background: rgba(123,227,255,0.2); color: var(--accent-2); }
        .choice-style.cold { background: rgba(138,138,160,0.3); color: #b0b0c0; }
        .choice-style.mad { background: rgba(179,136,255,0.25); color: var(--accent-3); }
        .choice-style.offend { background: rgba(255,82,82,0.2); color: #ff5252; }
        .choice-text { font-size: 15px; line-height: 1.5; color: #fff; }
        .choice-prediction { font-size: 12px; color: var(--text-dim); margin-top: 8px; font-style: italic; border-top: 1px dashed rgba(255,255,255,0.08); padding-top: 8px; }
        .input-panel { background: var(--bg-panel); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        textarea { width: 100%; height: 100px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: #fff; padding: 14px; font-size: 14px; outline: none; }
        .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-3)); color: #0a0a12; border: none; padding: 16px; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-primary:hover { transform: translateY(-2px); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1a1a2e; border: 1px solid rgba(255,126,182,0.3); padding: 25px; border-radius: 20px; width: 90%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; }
        .modal-content input, .modal-content textarea { background: rgba(0,0,0,0.3); border: 1px solid #444; border-radius: 8px; color: #fff; padding: 10px; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1>✦ Cf · Galgame v2.4</h1>
            <div class="topbar-controls">
                <select id="sessionSelect" onchange="changeSession()"></select>
                <button class="icon-btn" onclick="openBgModal()">📖 前情</button>
                <button class="icon-btn" onclick="openSaves()">💾 存档</button>
            </div>
        </div>
        <div class="scene">
            <span class="character-tag" id="characterTag">对 方</span>
            <div class="dialogue" id="dialogueText">等待你的第一条情报...</div>
            <div class="status-bar">
                <div class="status-item">❤️ 好感度<span class="value affinity-val" id="affinityVal">--</span></div>
                <div class="status-item">⚠️ 危险度<span class="value danger-val" id="dangerVal">--</span></div>
            </div>
        </div>
        <div class="advice-box" id="adviceBox"></div>
        <div class="choices" id="choicesContainer"></div>
        <div class="input-panel">
            <div style="display:flex; gap:10px; margin-bottom:5px;">
                <span style="font-size:12px; color:#aaa; line-height:30px;">🎭 心情:</span>
                <input type="text" id="moodInput" value="平静" list="moodList" style="flex:1; background: rgba(0,0,0,0.3); border: 1px solid #444; border-radius: 8px; color: #FFD700; padding: 6px 10px; outline: none; font-size: 13px;">
                <datalist id="moodList"><option value="平静">平静</option><option value="开心">开心</option><option value="烦躁">烦躁</option><option value="委屈">委屈</option><option value="高冷">高冷</option><option value="发疯">发疯</option></datalist>
            </div>
            <textarea id="chatInput" placeholder="粘贴对方的聊天记录，开启这场「对话」..."></textarea>
            <button class="btn-primary" id="analyzeBtn" onclick="analyze()">⚔️ 开启分析</button>
        </div>
    </div>
    <div class="modal" id="bgModal">
        <div class="modal-content">
            <h3>📖 前情提要</h3>
            <textarea id="bgInput" placeholder="简述之前发生的事件..." style="height:100px;"></textarea>
            <div style="display:flex; gap:10px;"><button class="btn-primary" onclick="saveBg()" style="flex:1;">保存</button><button class="btn-primary" onclick="closeBgModal()" style="flex:1; background:#333; color:#fff;">关闭</button></div>
        </div>
    </div>
    <div class="modal" id="savesModal">
        <div class="modal-content">
            <h3>💾 剧情存档</h3>
            <div id="savesList" style="max-height:300px; overflow-y:auto; display:flex; flex-direction:column; gap:10px;"></div>
            <button class="btn-primary" onclick="closeSaves()">关闭</button>
        </div>
    </div>
    <script>
        let currentSession = "默认单聊"; let currentBg = ""; let currentScene = null;
        window.onload = async () => { await loadSessions(); };
        async function loadSessions() {
            const res = await fetch('/api/sessions'); const data = await res.json();
            const select = document.getElementById('sessionSelect'); select.innerHTML = '';
            data.sessions.forEach(s => { const opt = document.createElement('option'); opt.value = s; opt.text = s; select.appendChild(opt); });
            currentSession = data.current_session; select.value = currentSession;
            const config = await (await fetch('/api/config')).json();
            currentBg = config.session_backgrounds?.[currentSession] || "";
        }
        async function changeSession() {
            currentSession = document.getElementById('sessionSelect').value;
            const config = await (await fetch('/api/config')).json();
            currentBg = config.session_backgrounds?.[currentSession] || "";
            document.getElementById('dialogueText').innerText = "已切换会话...";
            document.getElementById('choicesContainer').innerHTML = '';
            document.getElementById('adviceBox').style.display = 'none';
            document.getElementById('affinityVal').innerText = '--'; document.getElementById('dangerVal').innerText = '--';
        }
        function openBgModal() { document.getElementById('bgInput').value = currentBg; document.getElementById('bgModal').style.display = 'flex'; }
        function closeBgModal() { document.getElementById('bgModal').style.display = 'none'; }
        async function saveBg() {
            const bg = document.getElementById('bgInput').value;
            await fetch('/api/background', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ session_name: currentSession, background: bg }) });
            currentBg = bg; alert("前情提要已保存！"); closeBgModal();
        }
        async function analyze() {
            const chatText = document.getElementById('chatInput').value.trim();
            if (!chatText) return alert("请粘贴聊天记录！");
            document.getElementById('analyzeBtn').disabled = true; document.getElementById('analyzeBtn').innerText = "⏳ 推演中...";
            const res = await fetch('/api/analyze', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ chat_text: chatText, session_name: currentSession, user_mood: document.getElementById('moodInput').value, user_context: currentBg })
            });
            const data = await res.json();
            renderScene(data, chatText);
            document.getElementById('analyzeBtn').disabled = false; document.getElementById('analyzeBtn').innerText = "⚔️ 开启分析";
        }
        function renderScene(data, chatText) {
            const lines = chatText.split('\n').filter(l => l.trim()); const lastLine = lines[lines.length - 1] || '';
            const displayText = lastLine.replace(/^[^：:]+[：:]/, '').trim() || data.surface_answer;
            document.getElementById('dialogueText').innerText = displayText;
            document.getElementById('affinityVal').innerText = (data.affinity_score || 50) + ' / 100';
            document.getElementById('dangerVal').innerText = (data.danger_level || 0) + ' / 10';
            if (data.action_advice && data.action_advice.trim() !== '无') { document.getElementById('adviceBox').innerText = data.action_advice; document.getElementById('adviceBox').style.display = 'block'; }
            const container = document.getElementById('choicesContainer'); container.innerHTML = '';
            (data.replies || []).forEach((r, idx) => {
                const btn = document.createElement('button'); btn.className = 'choice-btn'; btn.style.display = 'block'; btn.style.animation = `fadeInUp 0.4s ease both ${idx * 0.08}s`;
                let styleClass = r.style === '幽默型' ? 'humor' : (r.style === '高冷型' ? 'cold' : (['发疯型','更疯型'].includes(r.style) ? 'mad' : (r.style === '冒犯型' ? 'offend' : '')));
                btn.innerHTML = `<span class="choice-style ${styleClass}">${r.style}</span><div class="choice-text">${r.text}</div><div class="choice-prediction">预测：${r.prediction || '未知'}</div>`;
                btn.onclick = () => { navigator.clipboard.writeText(r.text).then(() => { const o = btn.innerHTML; btn.innerHTML = '<div style="text-align:center; color:#00E676;">✅ 已复制</div>'; setTimeout(() => btn.innerHTML = o, 1200); }); };
                container.appendChild(btn);
            });
            currentScene = { dialogue: displayText, affinity: data.affinity_score || 50, danger: data.danger_level || 0, advice: data.action_advice || '', replies: data.replies || [], original_input: chatText };
        }
        function openSaves() { document.getElementById('savesModal').style.display = 'flex'; refreshSaves(); }
        function closeSaves() { document.getElementById('savesModal').style.display = 'none'; }
        async function refreshSaves() {
            const res = await fetch(`/api/saves/${encodeURIComponent(currentSession)}`); const saves = await res.json();
            const list = document.getElementById('savesList'); list.innerHTML = '';
            if (!saves || saves.length === 0) { list.innerHTML = '<div style="text-align:center; color:#888;">暂无存档</div>'; return; }
            saves.forEach(s => {
                const item = document.createElement('div'); item.style.cssText = 'background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; border: 1px solid #444; display:flex; justify-content:space-between;';
                item.innerHTML = `<div><div style="color:#fff;">💠 ${s.note}</div><div style="font-size:11px; color:#888;">${s.time} | 好感度${s.scene.affinity} 危险度${s.scene.danger}</div></div>`;
                const btn = document.createElement('button'); btn.innerText = '📂 读档'; btn.style.cssText = 'background:#00E676; border:none; border-radius:4px; padding:5px 10px; font-weight:bold; cursor:pointer;';
                btn.onclick = () => loadSave(s.id);
                item.appendChild(btn); list.appendChild(item);
            });
        }
        async function loadSave(saveId) {
            const res = await fetch(`/api/saves/${encodeURIComponent(currentSession)}`); const saves = await res.json();
            const save = saves.find(s => s.id === saveId); if (!save) return;
            const scene = save.scene;
            document.getElementById('dialogueText').innerText = scene.dialogue;
            document.getElementById('affinityVal').innerText = scene.affinity + ' / 100';
            document.getElementById('dangerVal').innerText = scene.danger + ' / 10';
            document.getElementById('chatInput').value = scene.original_input || '';
            document.getElementById('adviceBox').innerText = scene.advice ? `💡 ${scene.advice}` : ''; document.getElementById('adviceBox').style.display = scene.advice ? 'block' : 'none';
            const container = document.getElementById('choicesContainer'); container.innerHTML = '';
            (scene.replies || []).forEach((r, idx) => {
                const btn = document.createElement('button'); btn.className = 'choice-btn'; btn.style.display = 'block';
                let styleClass = r.style === '幽默型' ? 'humor' : (r.style === '高冷型' ? 'cold' : (['发疯型','更疯型'].includes(r.style) ? 'mad' : (r.style === '冒犯型' ? 'offend' : '')));
                btn.innerHTML = `<span class="choice-style ${styleClass}">${r.style}</span><div class="choice-text">${r.text}</div><div class="choice-prediction">预测：${r.prediction || '未知'}</div>`;
                btn.onclick = () => { navigator.clipboard.writeText(r.text); };
                container.appendChild(btn);
            });
            closeSaves();
        }
    </script>
    <style>@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }</style>
</body>
</html>
