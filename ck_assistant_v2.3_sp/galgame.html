<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cf · Galgame 模式</title>
    <style>
        :root {
            --bg-deep: #0a0a12;
            --bg-panel: rgba(22, 22, 34, 0.85);
            --accent: #ff7eb6;
            --accent-2: #7be3ff;
            --accent-3: #b388ff;
            --text: #e8e8f0;
            --text-dim: #8a8aa0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
        body { background: radial-gradient(circle at 50% 0%, #1a1a2e 0%, var(--bg-deep) 60%); color: var(--text); min-height: 100vh; display: flex; justify-content: center; padding: 20px; overflow-x: hidden; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(2px 2px at 20% 30%, rgba(255,126,182,0.4), transparent), radial-gradient(2px 2px at 60% 70%, rgba(123,227,255,0.4), transparent), radial-gradient(1px 1px at 80% 20%, rgba(179,136,255,0.4), transparent), radial-gradient(1px 1px at 30% 80%, rgba(255,126,182,0.3), transparent); background-size: 400px 400px; pointer-events: none; z-index: 0; }
        .container { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 18px; position: relative; z-index: 1; }
        .topbar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); backdrop-filter: blur(20px); border: 1px solid rgba(255,126,182,0.2); padding: 12px 20px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .topbar h1 { font-size: 16px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: 1px; }
        .topbar-controls { display: flex; align-items: center; gap: 8px; }
        .topbar select { background: rgba(0,0,0,0.4); color: var(--accent-2); border: 1px solid rgba(123,227,255,0.3); border-radius: 8px; padding: 6px 12px; font-weight: bold; outline: none; font-size: 12px; }
        .icon-btn { background: rgba(255,126,182,0.15); border: 1px solid rgba(255,126,182,0.4); color: var(--accent); border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.25s; }
        .icon-btn:hover { background: rgba(255,126,182,0.3); }
        .scene { background: var(--bg-panel); backdrop-filter: blur(20px); border: 1px solid rgba(123,227,255,0.15); border-radius: 20px; padding: 30px 25px; min-height: 180px; display: flex; flex-direction: column; justify-content: center; position: relative; box-shadow: 0 8px 32px rgba(0,0,0,0.4); overflow: hidden; }
        .scene::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent); animation: shimmer 3s ease-in-out infinite; }
        @keyframes shimmer { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        .character-tag { display: inline-block; background: linear-gradient(135deg, var(--accent), var(--accent-3)); color: #0a0a12; font-weight: bold; font-size: 12px; padding: 4px 14px; border-radius: 20px; margin-bottom: 15px; align-self: flex-start; letter-spacing: 1px; box-shadow: 0 0 20px rgba(255,126,182,0.4); }
        .dialogue { font-size: 17px; line-height: 1.7; color: #fff; padding: 15px 20px; background: rgba(0,0,0,0.3); border-left: 3px solid var(--accent); border-radius: 8px; position: relative; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
        .dialogue::before { content: '「'; color: var(--accent); font-size: 20px; margin-right: 2px; }
        .dialogue::after { content: '」'; color: var(--accent); font-size: 20px; margin-left: 2px; }
        .status-bar { display: flex; gap: 10px; margin-top: 18px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.08); }
        .status-item { flex: 1; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 12px; text-align: center; font-size: 12px; color: var(--text-dim); }
        .status-item .value { display: block; font-size: 20px; font-weight: bold; margin-top: 4px; text-shadow: 0 0 12px currentColor; }
        .affinity-val { color: #ff7eb6; }
        .danger-val { color: #ffb84d; }
        .advice-box { background: linear-gradient(135deg, rgba(179,136,255,0.15), rgba(123,227,255,0.1)); border: 1px solid rgba(179,136,255,0.3); border-radius: 14px; padding: 15px 20px; font-size: 13px; color: #d0c0ff; line-height: 1.6; display: none; box-shadow: 0 4px 20px rgba(179,136,255,0.15); }
        .advice-box::before { content: '💡 '; font-size: 15px; }
        .choices { display: flex; flex-direction: column; gap: 12px; }
        .choice-btn { background: linear-gradient(135deg, rgba(255,126,182,0.08), rgba(179,136,255,0.05)); border: 2px solid rgba(255,126,182,0.3); border-radius: 16px; padding: 18px 22px; text-align: left; color: var(--text); cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; display: none; }
        .choice-btn::before { content: '▶'; position: absolute; left: -30px; top: 50%; transform: translateY(-50%); color: var(--accent); font-size: 14px; transition: all 0.25s; opacity: 0; }
        .choice-btn:hover { background: linear-gradient(135deg, rgba(255,126,182,0.2), rgba(179,136,255,0.15)); border-color: var(--accent); transform: translateX(6px); box-shadow: 0 8px 30px rgba(255,126,182,0.3); }
        .choice-btn:hover::before { left: 12px; opacity: 1; }
        .choice-btn:hover .choice-text { padding-left: 20px; }
        .choice-style { font-size: 11px; font-weight: bold; letter-spacing: 1px; padding: 3px 10px; border-radius: 20px; display: inline-block; margin-bottom: 8px; background: rgba(255,126,182,0.2); color: var(--accent); }
        .choice-style.humor { background: rgba(123,227,255,0.2); color: var(--accent-2); }
        .choice-style.cold { background: rgba(138,138,160,0.3); color: #b0b0c0; }
        .choice-style.mad { background: rgba(179,136,255,0.25); color: var(--accent-3); }
        .choice-style.offend { background: rgba(255,82,82,0.2); color: #ff5252; }
        .choice-text { font-size: 15px; line-height: 1.5; color: #fff; transition: padding-left 0.25s; }
        .choice-prediction { font-size: 12px; color: var(--text-dim); margin-top: 8px; font-style: italic; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.08); }
        .choice-prediction::before { content: '⤷ '; color: var(--accent-2); }
        .input-panel { background: var(--bg-panel); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        textarea { width: 100%; height: 100px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: #fff; padding: 14px; font-size: 14px; resize: vertical; outline: none; font-family: inherit; transition: all 0.25s; }
        textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,126,182,0.15); }
        .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-3)); color: #0a0a12; border: none; padding: 16px; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.25s; letter-spacing: 1px; box-shadow: 0 4px 20px rgba(255,126,182,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,126,182,0.5); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .action-row { display: flex; gap: 10px; margin-top: 5px; }
        .btn-save-scene { flex: 1; background: rgba(123,227,255,0.1); border: 1px solid rgba(123,227,255,0.4); color: var(--accent-2); border-radius: 10px; padding: 10px; font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.25s; display: none; }
        .btn-save-scene:hover { background: rgba(123,227,255,0.25); }
        .loading { display: none; text-align: center; padding: 20px; color: var(--accent-2); font-size: 14px; letter-spacing: 2px; }
        .loading::after { content: ''; animation: dots 1.5s infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60%, 100% { content: '...'; } }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .modal-content { background: linear-gradient(135deg, #1a1a2e, #141420); border: 1px solid rgba(255,126,182,0.3); padding: 25px; border-radius: 20px; width: 100%; max-width: 600px; max-height: 80vh; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 20px 60px rgba(255,126,182,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .modal-header h2 { font-size: 16px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .close-btn { background: transparent; border: none; color: #888; font-size: 20px; cursor: pointer; padding: 0 8px; }
        .close-btn:hover { color: #fff; }
        .saves-list { overflow-y: auto; max-height: 50vh; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
        .saves-list::-webkit-scrollbar { width: 6px; }
        .saves-list::-webkit-scrollbar-thumb { background: rgba(255,126,182,0.3); border-radius: 3px; }
        .save-item { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 15px; cursor: pointer; transition: all 0.25s; display: flex; justify-content: space-between; align-items: center; }
        .save-item:hover { background: rgba(255,126,182,0.1); border-color: var(--accent); }
        .save-item-info { flex: 1; }
        .save-item-note { color: #fff; font-weight: bold; font-size: 14px; margin-bottom: 4px; }
        .save-item-meta { color: var(--text-dim); font-size: 12px; }
        .save-item-actions { display: flex; gap: 5px; }
        .save-item-actions button { background: transparent; border: 1px solid rgba(255,82,82,0.3); color: #ff5252; border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer; }
        .save-item-actions button:hover { background: rgba(255,82,82,0.2); }
        .empty-tip { text-align: center; color: var(--text-dim); padding: 30px; font-size: 14px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); }
        .btn-clear-saves { background: rgba(255,82,82,0.1); border: 1px solid rgba(255,82,82,0.4); color: #ff5252; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .btn-clear-saves:hover { background: rgba(255,82,82,0.25); }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1>✦ Cf · Galgame 模式</h1>
            <div class="topbar-controls">
                <select id="sessionSelect" onchange="changeSession()"></select>
                <button class="icon-btn" onclick="openSaves()">💾 存档</button>
            </div>
        </div>
        <div class="scene">
            <span class="character-tag" id="characterTag">对 方</span>
            <div class="dialogue" id="dialogueText">等待你的第一条情报...</div>
            <div class="status-bar">
                <div class="status-item">❤️ 好感度<span class="value affinity-val" id="affinityVal">--</span></div>
                <div class="status-item">⚠️ 危险度<span class="value danger-val" id="dangerVal">--</span></div>
            </div>
        </div>
        <div class="advice-box" id="adviceBox"></div>
        <div class="action-row">
            <button class="btn-save-scene" id="saveSceneBtn" onclick="saveCurrentScene()">💾 保存当前剧情到存档</button>
        </div>
        <div class="choices" id="choicesContainer"></div>
        <div class="loading" id="loadingText">分析中</div>
        <div class="input-panel">
            <textarea id="chatInput" placeholder="粘贴对方的聊天记录，点击下方按钮开启这场「对话」..."></textarea>
            <button class="btn-primary" id="analyzeBtn" onclick="analyze()">⚔️ 开启分析</button>
        </div>
    </div>
    <div class="modal" id="savesModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📖 剧情存档 · <span id="modalSessionName"></span></h2>
                <button class="close-btn" onclick="closeSaves()">✖</button>
            </div>
            <div class="saves-list" id="savesList"><div class="empty-tip">暂无存档</div></div>
            <div class="modal-footer">
                <button class="btn-clear-saves" onclick="clearAllSaves()">🗑️ 清空全部存档</button>
            </div>
        </div>
    </div>
    <script>
        let currentSession = "默认单聊";
        let currentScene = null;
        window.onload = async () => {
            const res = await fetch('/api/sessions');
            const data = await res.json();
            const select = document.getElementById('sessionSelect');
            data.sessions.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s; opt.text = s;
                select.appendChild(opt);
            });
            currentSession = data.current_session || "默认单聊";
            select.value = currentSession;
        };
        async function changeSession() {
            currentSession = document.getElementById('sessionSelect').value;
            document.getElementById('dialogueText').innerText = "已切换会话，请粘贴新的情报...";
            document.getElementById('choicesContainer').innerHTML = '';
            document.getElementById('adviceBox').style.display = 'none';
            document.getElementById('affinityVal').innerText = '--';
            document.getElementById('dangerVal').innerText = '--';
            document.getElementById('saveSceneBtn').style.display = 'none';
            currentScene = null;
        }
        async function analyze() {
            const chatText = document.getElementById('chatInput').value.trim();
            if (!chatText) return alert("请粘贴聊天记录！");
            document.getElementById('analyzeBtn').disabled = true;
            document.getElementById('loadingText').style.display = 'block';
            document.getElementById('choicesContainer').innerHTML = '';
            document.getElementById('adviceBox').style.display = 'none';
            document.getElementById('dialogueText').innerText = "对方正在思考中...";
            document.getElementById('saveSceneBtn').style.display = 'none';
            try {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_text: chatText, session_name: currentSession })
                });
                const data = await res.json();
                renderScene(data, chatText);
            } catch (e) {
                document.getElementById('dialogueText').innerText = "❌ 连接失败：" + e.message;
            } finally {
                document.getElementById('analyzeBtn').disabled = false;
                document.getElementById('loadingText').style.display = 'none';
            }
        }
        function renderScene(data, chatText) {
            const lines = chatText.split('\n').filter(l => l.trim());
            const lastLine = lines[lines.length - 1] || '';
            const displayText = lastLine.replace(/^[^：:]+[：:]/, '').trim() || data.surface_answer;
            document.getElementById('dialogueText').innerText = displayText;
            const affinity = data.affinity_score || 50;
            const danger = data.danger_level || 0;
            document.getElementById('affinityVal').innerText = affinity + ' / 100';
            document.getElementById('dangerVal').innerText = danger + ' / 10';
            if (data.action_advice && data.action_advice.trim() !== '无') {
                document.getElementById('adviceBox').innerText = data.action_advice;
                document.getElementById('adviceBox').style.display = 'block';
            }
            const container = document.getElementById('choicesContainer');
            container.innerHTML = '';
            (data.replies || []).forEach((r, idx) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.style.display = 'block';
                btn.style.animation = `fadeInUp 0.4s ease both ${idx * 0.08}s`;
                let styleClass = '';
                if (r.style === '幽默型') styleClass = 'humor';
                else if (r.style === '高冷型') styleClass = 'cold';
                else if (r.style === '发疯型' || r.style === '更疯型') styleClass = 'mad';
                else if (r.style === '冒犯型') styleClass = 'offend';
                btn.innerHTML = `<span class="choice-style ${styleClass}">${r.style}</span><div class="choice-text">${r.text}</div><div class="choice-prediction">预测：${r.prediction || '未知'}</div>`;
                btn.onclick = () => {
                    navigator.clipboard.writeText(r.text).then(() => {
                        const original = btn.innerHTML;
                        btn.innerHTML = '<div style="text-align:center; font-size:16px; color:#00E676;">✅ 已复制到剪贴板</div>';
                        setTimeout(() => btn.innerHTML = original, 1200);
                    });
                };
                container.appendChild(btn);
            });
            currentScene = {
                dialogue: displayText,
                affinity: affinity,
                danger: danger,
                advice: data.action_advice || '',
                replies: data.replies || [],
                original_input: chatText
            };
            document.getElementById('saveSceneBtn').style.display = 'block';
        }
        async function saveCurrentScene() {
            if (!currentScene) return alert("还没有可保存的剧情！");
            const note = prompt("给这个剧情节点起个名字：", "剧情 " + new Date().toLocaleTimeString());
            if (note === null) return;
            const res = await fetch('/api/saves', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    session_name: currentSession,
                    note: note,
                    scene: currentScene
                })
            });
            const data = await res.json();
            if (data.status === 'success') {
                const btn = document.getElementById('saveSceneBtn');
                const original = btn.innerText;
                btn.innerText = "✅ 已保存到存档！";
                setTimeout(() => btn.innerText = original, 1500);
            } else {
                alert("保存失败");
            }
        }
        async function openSaves() {
            document.getElementById('modalSessionName').innerText = currentSession;
            document.getElementById('savesModal').style.display = 'flex';
            await refreshSaves();
        }
        function closeSaves() { document.getElementById('savesModal').style.display = 'none'; }
        async function refreshSaves() {
            const res = await fetch(`/api/saves/${encodeURIComponent(currentSession)}`);
            const saves = await res.json();
            const list = document.getElementById('savesList');
            list.innerHTML = '';
            if (!saves || saves.length === 0) {
                list.innerHTML = '<div class="empty-tip">📭 暂无存档，去玩一玩再回来保存吧～</div>';
                return;
            }
            saves.forEach(s => {
                const item = document.createElement('div');
                item.className = 'save-item';
                item.innerHTML = `
                    <div class="save-item-info">
                        <div class="save-item-note">💠 ${s.note}</div>
                        <div class="save-item-meta">🕒 ${s.time} · 好感度 ${s.scene.affinity}/100 · 危险度 ${s.scene.danger}/10</div>
                    </div>
                    <div class="save-item-actions">
                        <button onclick="event.stopPropagation(); loadSave('${s.id}')">📂 读档</button>
                        <button onclick="event.stopPropagation(); deleteSave('${s.id}')">🗑️</button>
                    </div>
                `;
                item.onclick = () => loadSave(s.id);
                item.dataset.saveId = s.id;
                list.appendChild(item);
            });
        }
        async function loadSave(saveId) {
            const res = await fetch(`/api/saves/${encodeURIComponent(currentSession)}`);
            const saves = await res.json();
            const save = saves.find(s => s.id === saveId);
            if (!save) return alert("存档不存在");
            const scene = save.scene;
            document.getElementById('dialogueText').innerText = scene.dialogue;
            document.getElementById('affinityVal').innerText = scene.affinity + ' / 100';
            document.getElementById('dangerVal').innerText = scene.danger + ' / 10';
            document.getElementById('chatInput').value = scene.original_input || '';
            if (scene.advice && scene.advice.trim() !== '无') {
                document.getElementById('adviceBox').innerText = scene.advice;
                document.getElementById('adviceBox').style.display = 'block';
            } else {
                document.getElementById('adviceBox').style.display = 'none';
            }
            const container = document.getElementById('choicesContainer');
            container.innerHTML = '';
            (scene.replies || []).forEach((r, idx) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.style.display = 'block';
                btn.style.animation = `fadeInUp 0.4s ease both ${idx * 0.08}s`;
                let styleClass = '';
                if (r.style === '幽默型') styleClass = 'humor';
                else if (r.style === '高冷型') styleClass = 'cold';
                else if (r.style === '发疯型' || r.style === '更疯型') styleClass = 'mad';
                else if (r.style === '冒犯型') styleClass = 'offend';
                btn.innerHTML = `<span class="choice-style ${styleClass}">${r.style}</span><div class="choice-text">${r.text}</div><div class="choice-prediction">预测：${r.prediction || '未知'}</div>`;
                btn.onclick = () => {
                    navigator.clipboard.writeText(r.text).then(() => {
                        const original = btn.innerHTML;
                        btn.innerHTML = '<div style="text-align:center; font-size:16px; color:#00E676;">✅ 已复制到剪贴板</div>';
                        setTimeout(() => btn.innerHTML = original, 1200);
                    });
                };
                container.appendChild(btn);
            });
            currentScene = scene;
            document.getElementById('saveSceneBtn').style.display = 'block';
            closeSaves();
            const dialogue = document.getElementById('dialogueText');
            dialogue.style.transition = 'all 0.4s';
            dialogue.style.boxShadow = '0 0 30px rgba(123,227,255,0.8)';
            setTimeout(() => dialogue.style.boxShadow = 'none', 800);
        }
        async function deleteSave(saveId) {
            if (!confirm("确定删除这个存档吗？")) return;
            await fetch(`/api/saves/${encodeURIComponent(currentSession)}/${saveId}`, { method: 'DELETE' });
            await refreshSaves();
        }
        async function clearAllSaves() {
            if (!confirm(`确定清空【${currentSession}】的所有存档吗？此操作不可恢复。`)) return;
            await fetch(`/api/saves/${encodeURIComponent(currentSession)}/clear`, { method: 'POST' });
            await refreshSaves();
        }
    </script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
